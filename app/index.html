<!doctype html><html lang="ru"><meta charset="utf-8"><title>Служба поддержки — nikita_zozulenko</title>
<style>body{font:16px Arial,sans-serif;color:#111;background:#fff;max-width:1100px;margin:24px auto;padding:0 16px}h1{font-size:26px}h2{font-size:21px}section{padding:16px 0;margin:18px 0;border-top:1px solid #bbb}button,select,input,textarea{font:inherit;padding:6px;margin:4px;border:1px solid #999;border-radius:0}button{cursor:pointer;background:#eee;color:#111}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border:1px solid #bbb}th{background:#eee}textarea{width:85%;height:60px}#error{color:#a00}small{color:#555}a{color:#0000ee}</style>
<h1>Служба поддержки</h1><small>Зозуленко Никита Алексеевич · БИСТ-24-2-ПО · nikita_zozulenko</small><p id="error"></p>
<section id="login"><h2>Вход</h2><input id="username" value="demo" placeholder="Логин"><input id="password" type="password" value="demo"><button onclick="signIn()">Войти</button></section>
<div id="main" hidden><nav><button onclick="list()">Заявки</button><button onclick="summary()">Сводка</button><button onclick="signOut()">Выйти</button></nav>
<section><h2>Новая заявка</h2><input id="title" placeholder="Тема"><select id="category"></select><br><textarea id="body" placeholder="Описание"></textarea><br><button onclick="createTicket()">Создать заявку</button></section>
<section id="content"></section></div>
<script>
let page=1,filter='',categories=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses={new:'Новая',in_progress:'В работе',closed:'Закрыта'};
async function api(path,method='GET',data){let r=await fetch('/api/'+path,{method,cache:'no-store',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok){document.querySelector('#error').textContent=`Ошибка ${r.status}: ${j.error}`;throw Error(j.error)}document.querySelector('#error').textContent='';return j}
async function signIn(){await api('login','POST',{username:document.querySelector('#username').value,password:document.querySelector('#password').value});categories=(await api('categories')).items;document.querySelector('#category').innerHTML=categories.map(c=>`<option value="${c.id}">${esc(c.name)} · SLA ${c.norm_minutes} мин</option>`).join('');document.querySelector('#login').hidden=true;document.querySelector('#main').hidden=false;await list()}
async function signOut(){await api('logout','POST');document.querySelector('#login').hidden=false;document.querySelector('#main').hidden=true}
async function list(){let j=await api(`tickets?page=${page}&size=20&status=${filter}`);document.querySelector('#content').innerHTML=`<h2>Заявки</h2><label>Статус <select onchange="filter=this.value;page=1;list()"><option value="">Все</option>${Object.entries(statuses).map(([k,v])=>`<option ${filter===k?'selected':''} value="${k}">${v}</option>`).join('')}</select></label><p>Всего: ${j.total} · страница ${page}</p><table><tr><th>№</th><th>Тема</th><th>Категория</th><th>Статус</th></tr>${j.items.map(t=>`<tr><td>${t.id}</td><td><a href="#" onclick="card(${t.id});return false">${esc(t.title)}</a></td><td>${esc(t.category)}</td><td>${statuses[t.status]}</td></tr>`).join('')}</table><button ${page<=1?'disabled':''} onclick="page--;list()">Назад</button><button ${page*20>=j.total?'disabled':''} onclick="page++;list()">Далее</button>`}
async function createTicket(){let t=await api('tickets','POST',{title:document.querySelector('#title').value,body:document.querySelector('#body').value,category_id:Number(document.querySelector('#category').value)});await card(t.id)}
async function card(id){let j=await api('tickets/'+id),t=j.ticket;document.querySelector('#content').innerHTML=`<h2>Заявка № ${id} — ${esc(t.title)}</h2><p>${esc(t.body)}</p><p>Автор: ${esc(t.display_name)} · ${esc(t.category)} · ${statuses[t.status]}</p><p>Норматив: ${t.norm_minutes} мин. Первый ответ сотрудника: ${t.reaction_seconds===null?'ещё не получен':(t.reaction_seconds/60).toFixed(1)+' мин'}. Нарушение SLA: <b>${t.sla_breached?'да':'нет'}</b></p>${t.status==='new'?`<button onclick="change(${id},'in_progress')">Взять в работу</button>`:''}${t.status==='in_progress'?`<button onclick="change(${id},'closed')">Закрыть</button>`:''}<h3>Переписка</h3>${j.comments.map(c=>`<p><b>${esc(c.display_name)} ${c.is_staff?'(сотрудник)':''}</b> · ${esc(c.created_at)}<br>${esc(c.body)}</p>`).join('')}${t.status!=='closed'?`<textarea id="message" placeholder="Ответ сотрудника"></textarea><br><button onclick="addComment(${id})">Отправить ответ</button>`:''}`}
async function change(id,status){await api(`tickets/${id}/status`,'PATCH',{status});await card(id)}
async function addComment(id){await api(`tickets/${id}/comments`,'POST',{body:document.querySelector('#message').value});await card(id)}
async function summary(){let j=await api('summary');document.querySelector('#content').innerHTML=`<h2>Сводка по всем данным</h2><p>Всего заявок: ${j.total_tickets}</p><table><tr><th>Категория</th><th>Открытые</th><th>Нарушен SLA</th><th>Доля нарушений</th></tr>${j.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.open}</td><td>${c.breached}</td><td>${(100*c.breached_share).toFixed(1)}%</td></tr>`).join('')}</table><p><small>Открытые — новые и в работе. Норматив сравнивается с первым ответом сотрудника; при отсутствии ответа — с текущим временем.</small></p>`}
</script></html>
